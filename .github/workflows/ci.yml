name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check spelling
        uses: crate-ci/typos@v1.47.0

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2

      - name: Run corpus tests
        run: tree-sitter test

  parse-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2

      - name: Download TheBigTestFile.ps1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/PowerShell/EditorSyntax/contents/examples/TheBigTestFile.ps1 --jq '.content' | base64 -d > /tmp/TheBigTestFile.ps1

      - name: Parse TheBigTestFile.ps1
        id: parse
        continue-on-error: true
        run: tree-sitter parse /tmp/TheBigTestFile.ps1 2>&1 | tee /tmp/parse-output.txt

      - name: Check error count
        run: |
          ERROR_COUNT=$(grep -c 'ERROR' /tmp/parse-output.txt || true)
          echo "Parse errors: $ERROR_COUNT"
          # TODO: Keep lowering this threshold as remaining TheBigTestFile regressions are fixed.
          if [ "$ERROR_COUNT" -gt 12 ]; then
            echo "::error::Too many parse errors ($ERROR_COUNT > 12)"
            grep 'ERROR' /tmp/parse-output.txt
            exit 1
          fi
          echo "Within acceptable threshold"

  parse-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter CLI
        uses: tree-sitter/setup-action/cli@v2

      - name: Parse every file under test/fixtures/
        shell: bash
        run: |
          set -o pipefail
          FAILED=0
          shopt -s nullglob
          for f in test/fixtures/*.ps1 test/fixtures/*.psm1; do
            echo "::group::$f"
            tree-sitter parse "$f" 2>&1 | tee /tmp/fixture-output.txt
            ISSUE_COUNT=$(grep -Ec 'ERROR|MISSING' /tmp/fixture-output.txt || true)
            echo "Parse recovery nodes: $ISSUE_COUNT"
            if [ "$ISSUE_COUNT" -ne 0 ]; then
              echo "::error file=$f::$f must parse with zero ERROR/MISSING nodes (found $ISSUE_COUNT)"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit "$FAILED"
